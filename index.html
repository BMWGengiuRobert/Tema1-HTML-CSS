<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <nav>
        <div class="app-title">Recipe Book</div>
        <div class="navbar-button">Authentificate</div>
        <div class="navbar-button">Shopping List</div>
    </nav>
    <section>
        <div class="left-content">
            <button class="new-recipe">New Recipe</button>
            <hr>
            <div class="food-cards">
                <div class="card">
                    <div class="food-info">
                        <p class="food-title">Toast</p>
                        <p class="food-description">toast info</p>
                    </div>
                    <img src="./images/toast.jpg" alt="toast image" />
                </div>
                <div class="card">
                    <div class="food-info">
                        <p class="food-title">Avocado</p>
                        <p class="food-description">avocado info</p>
                    </div>
                    <img src="./images/avocado.jpg" alt="avocado image" />
                </div>
            </div>
        </div>
        <div class="right-content">
            <div class="recipe-name">
                <div class="recipe-name__buttons">
                    <button class="recipe-name__buttons__save">Save</button>
                    <button class="recipe-name__buttons__cancel">Cancel</button>
                </div>
                <label type="text" for="name-input"><span>Name</span></label>
                <input type="text" name="new-recipe-name" id="name-input" value="Fries">
            </div>
            <div class="url-section">
                <label type="text" for="url-input"><span>Image URL</span></label>
                <input type="text" name="new-recipe-url" id="url-input"
                    value="https://upload.wikimedia.org/wikipedia/commons/8/83/French_Fries.JPG">
            </div>
            <div class="description-section">
                <img src="./images/French_Fries.jpg" alt="french fries image" />
                <label type="text" for="description-input"><span>Description</span></label>
                <textarea name="new-recipe-description" id="description-input">Cartofi</textarea>
            </div>
            <div class="ingredients-section">
                <div class="input-ingredients">
                    <input type="text" name="recipe-ingredient" id="ingredient-input" value="Cartofi">
                    <input type="text" name="recipe-amount" id="amount-input" value="2">
                    <button class="add-amount-button">X</button>
                </div>
                <div class="input-ingredients">
                    <input type="text" name="recipe-ingredient" id="ingredient-input">
                    <input type="text" name="recipe-amount" id="amount-input">
                    <button class="add-amount-button">X</button>
                </div>
                <hr>
                <button class="add-ingredient-button">Add Ingredient</button>
            </div>
        </div>
    </section>
</body>

</html>
